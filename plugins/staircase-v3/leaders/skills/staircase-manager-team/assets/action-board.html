<title>Action Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --bg:#F4F5FA;
  --surface:#FFFFFF;
  --surface-2:#EEF0F7;
  --line:#D8DBE8;
  --line-strong:#B9BED3;
  --text:#1A1C2C;
  --text-2:#4C516B;
  --text-3:#666B85;
  --accent:#4B53D4;
  --accent-strong:#3A41B3;
  --accent-ink:#FFFFFF;
  --accent-soft:#E8E9FB;
  --accent-text:#3A41B3;
  --focus:#4B53D4;
  --red:#C8283A;
  --red-soft:#FCEBED;
  --red-ink:#8E1B2A;
  --red-line:#EFB4BB;
  --green:#1F7A4D;
  --green-soft:#E4F4EB;
  --green-ink:#145C39;
  --green-line:#A9D8BF;
  --blue:#1D6DB5;
  --blue-soft:#E5F0FA;
  --blue-ink:#14507F;
  --blue-line:#A9CDEA;
  --yellow:#B27A00;
  --yellow-soft:#FBF2D8;
  --yellow-ink:#6F4A00;

  --toast-bg:#1A1C2C;
  --toast-ink:#FFFFFF;
  color-scheme:light;
}

  :root:not([data-theme="light"]){
    --bg:#0F1018;
    --surface:#181A26;
    --surface-2:#212435;
    --line:#31354C;
    --line-strong:#494E6B;
    --text:#ECEEF8;
    --text-2:#B4B8D0;
    --text-3:#9196B2;
    --accent:#5961E6;

    --accent-ink:#FFFFFF;
    --accent-soft:#23264A;

    --red-line:#6E2F3B;
    --green:#4CC48A;
    --green-soft:#173225;
    --green-ink:#9BE3BF;
    --green-line:#2C6A4A;
    --blue:#5AA6EC;
    --blue-soft:#14283E;
    --blue-ink:#A8D2F7;
    --blue-line:#2D5C8A;

:root[data-theme="dark"]{
  --bg:#0F1018;
  --surface:#181A26;
  --surface-2:#212435;
  --line:#31354C;
  --line-strong:#494E6B;
  --text:#ECEEF8;
  --text-2:#B4B8D0;
  --text-3:#9196B2;

  --blue-line:#2D5C8A;
  --yellow:#E3B341;
  --yellow-soft:#33290F;
  --yellow-ink:#F1D58A;
  --yellow-line:#6B5719;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  --toast-bg:#ECEEF8;
  --toast-ink:#12131C;

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit}
:where(button,select,summary):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.has-bar{padding-bottom:112px}
.fine{margin:8px 0 0;font-size:12.5px;color:var(--text-3)}

.hd{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.hd-main{display:flex;gap:12px;align-items:flex-start;min-width:0;flex:1 1 360px}
.mark{flex:none;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:2px}
.mark svg{width:22px;height:22px;display:block}
.eyebrow{margin:0 0 1px;font-size:12.5px;color:var(--text-3)}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:750}
.glance{margin:4px 0 0;color:var(--text-2);font-size:14.5px}
.glance .linkbtn,.mtg .linkbtn{display:inline;min-height:0;padding:1px 0;font-size:inherit}
.glance .linkbtn{font-weight:650}
.tip{display:flex;align-items:flex-start;gap:10px;margin:12px 0 0;padding:8px 10px;border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue-ink);border-radius:8px;font-size:13.5px}
.tip p{margin:0;flex:1}
.tip .linkbtn{color:var(--blue-ink);flex:none}
.mtg{margin:14px 0 0;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mtg h2,.sec h2,.panel h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);font-weight:750}
.mtg h2{margin-bottom:4px}
.mtg ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.mtg li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:0 6px;font-size:14px;color:var(--text-2);line-height:1.5}
.mtg .day{font-weight:700;color:var(--text)}
.mtg .w{color:var(--text-3)}
.sec{margin:20px 0 10px;display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.sec h2{font-size:13px}

.chip{display:inline-flex;align-items:center;max-width:100%;padding:1px 9px;border-radius:999px;font-size:12px;line-height:18px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2)}
.chip.cls{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-text)}
.chip.risk{background:var(--red-soft);border-color:var(--red-line);color:var(--red-ink)}
.chip.dm{background:var(--red-soft);border-color:var(--red);color:var(--red-ink);font-weight:750}
.chip.good{background:var(--green-soft);border-color:var(--green-line);color:var(--green-ink)}
.chip.info{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-ink)}
.chip.avg{background:var(--yellow-soft);border-color:var(--yellow-line);color:var(--yellow-ink)}
.chip.when{background:var(--surface);border-color:var(--line-strong)}
.chip.sug{background:var(--surface);border:1px dashed var(--line-strong)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:6px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px;font-weight:500}
.linkbtn{background:none;border:0;padding:3px 2px;min-height:26px;color:var(--accent-text);font-size:13px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.qb{min-height:30px;padding:3px 9px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-2);font-size:13px;font-weight:500;cursor:pointer}
.qb:hover{background:var(--surface-2);color:var(--text)}
.qb[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent-text)}
.snzw{position:relative;display:inline-flex;align-items:center}
.snz{appearance:none;-webkit-appearance:none;min-height:30px;padding:3px 26px 3px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer}
.snz option{background:var(--surface);color:var(--text)}
.snzw::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:2px solid var(--text-2);border-bottom:2px solid var(--text-2);transform:rotate(45deg);pointer-events:none}
.tog::after{content:"";display:inline-block;width:6px;height:6px;margin:-3px 0 0 8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s}
.tog[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;margin:0 0 10px;scroll-margin-top:12px}
.card.sev{border-left:4px solid var(--red);padding-left:11px}
.card:focus{outline:none}
.c-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.rank{flex:none;min-width:24px;height:24px;padding:0 6px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);display:inline-grid;place-items:center;font-weight:750;font-size:13px}
.acct{font-size:16.5px;line-height:1.25;margin:0;font-weight:750;overflow-wrap:anywhere;min-width:0}
.acct a,.nm a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.acct a:hover,.acct a:focus-visible,.nm a:hover,.nm a:focus-visible{border-bottom-color:currentColor}
.ext{font-size:.8em;font-weight:600;color:var(--accent-text);margin-left:3px}
.btn.why-btn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-soft)}
.tags{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.why{margin:5px 0 0;font-size:14.5px;line-height:1.4}
.pv{display:flex;align-items:center;gap:8px;margin-top:7px;min-width:0}
.pv-t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--text-3);padding-left:8px;border-left:3px solid var(--line-strong)}
.pv .linkbtn{flex:none}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.quiet{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin-left:auto}
.done-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px;color:var(--text-2);font-size:14px}
.card.is-done{background:var(--surface-2);box-shadow:none}
.card.is-done .acct{text-decoration:line-through;color:var(--text-3)}
.panel{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong)}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.draft{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:10px 12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:14px}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;overflow-wrap:anywhere}
.body{white-space:pre-wrap;font:14px/1.5 var(--font);margin:10px 0 0;overflow-wrap:anywhere}
.why-p{margin:8px 0 0;font-size:14px}
.ctx{margin:8px 0 0;padding-left:18px;display:grid;gap:5px;font-size:14px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ev{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.ev-l{font-size:12.5px;font-weight:700;color:var(--text-2)}
.q{margin:4px 0 0;padding:2px 0 2px 10px;border-left:3px solid var(--line-strong);font-size:14px;overflow-wrap:anywhere}
.q::before{content:"\201C"}
.q::after{content:"\201D"}
.ev-item.customer .q{border-left-color:var(--blue)}

.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.6fr) auto;gap:4px 14px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ra{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;min-width:0;font-weight:700;font-size:14px;line-height:1.3}
.ra .rank{min-width:20px;height:20px;padding:0 5px;font-size:12px}
.ra .nm{overflow-wrap:anywhere}
.rm{font-size:13px;color:var(--text-2);min-width:0}
.rb{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:2px 10px}
.rb .linkbtn{min-height:24px;padding:2px}
.more-foot{margin-top:8px}
.strips{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:20px}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;min-width:0}
.strip summary{cursor:pointer}
.mini{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:13px;color:var(--text-2)}
.foot{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.foot summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--text-2);padding:4px 0}
.foot dl{display:grid;grid-template-columns:minmax(80px,120px) minmax(0,1fr);gap:8px 14px;margin:10px 0 0;font-size:13.5px}
.foot dt{color:var(--text-3)}
.foot dd{margin:0;overflow-wrap:anywhere}
.foot ul{margin:0;padding-left:18px}
.cmds{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center}
.verb{font:12px/1 var(--mono);color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:4px 6px;white-space:nowrap}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line-strong);box-shadow:var(--shadow);padding:10px max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;max-width:min(520px,calc(100vw - 32px));background:var(--toast-bg);color:var(--toast-ink);border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:var(--shadow)}
.has-bar .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.toast .verb{margin-left:4px}
.err{padding:16px;border:1px solid var(--red-line);background:var(--red-soft);color:var(--red-ink);border-radius:10px}

@media (max-width:720px){
  .row{grid-template-columns:minmax(0,1fr);gap:0;padding:5px 12px}
  .ra{flex-wrap:nowrap}
  .ra .nm,.ra .chip,.rm{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ra .chip{flex-shrink:4}
  .rm{line-height:1.3}
  .rb{justify-content:flex-start}
}
@media (max-width:560px){
  .wrap{padding-block:16px 48px}
  h1{font-size:20px}
  .card{padding:9px 12px}
  .card.sev{padding-left:9px}
  .c-head{gap:2px 8px}
  .acct{font-size:16px}
  .why{font-size:14px;margin-top:3px;line-height:1.38}
  .pv{margin-top:4px}
  .pv .linkbtn{min-height:22px}
  .ctl{margin-top:6px;gap:3px}
  .pri{flex:1 1 0;min-width:0}
  .why-btn{flex:none}
  .quiet{margin-left:0;width:100%;justify-content:space-between}
}
@media (pointer:coarse){
  .btn{min-height:44px}
  .btn.sm{min-height:40px}
  .qb,.snz{min-height:36px}
  .linkbtn,.pv .linkbtn,.rb .linkbtn{min-height:32px}
  .glance .linkbtn,.mtg .linkbtn{min-height:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important;animation:none !important;scroll-behavior:auto !important}
}
</style>

<div class="wrap">
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
  <div id="app"><p class="fine">Loading the board.</p></div>
  <noscript><p class="err">This board needs JavaScript to draw itself.</p></noscript>
  <div class="toast" id="toast" aria-hidden="true" hidden></div>
</div>

<!--
BOARD DATA SCHEMA. Claude rewrites only the JSON block below, once per run. Every field is optional unless starred.
Write the less-than sign as \u003c in strings. Use \n for line breaks in drafts. No raw double quotes inside strings.
Visible strings use references/plain-words.md: no ids, scores or field names.

board: {id* (unique per run, include the time; clears are remembered under it), title* (the date), as_of*, headline (default "N things need you today"),
        start_with{account, why (10 words or fewer)}, next_up (empty day), scope_line, window_line, seen_line, blind_line, rank_rule (one plain sentence), counts{active}}
pinned[] then items[]: each row is
  {n* (display order, top to bottom through the groups), account*,
   trigger_class* (Waiting on you | Recap owed | Prep | New risk | Ongoing risk | Contact change | Quiet | Renewal | Ready to grow),
   when_group* (Do today | Prep for Wed | This week | This week: closures to hand off; groups show in order of first appearance),
   dont_miss: true on a settled closure (pinned[] rows are always Don't miss), dont_miss_reason (default "Renews soon at high risk"),
   why_now* (12 words or fewer: the card line), account_url (the account's Staircase page, from customer.url; https only),
   context[] (Why this: 2 to 4 lines on where things stand, the history, who is involved, what has been tried, what happens next.
              Each line adds what the card line does not say; never restate why_now or the headline. Lines that repeat it are dropped),
   meets (else matched from the meetings by account name),
   stakes[{label, tone: risk | good | info | avg | plain}] (a risk tone gives the card its red edge; the chips show in Why this only when context[] is empty),
   action{kind: email | slack | meeting | escalation | brief | record_fix, recipient, verb (default "draft n"; "brief Account Name" for brief),
          draft{to, subject, body} or {channel_or_person, text}; first_line optional},
   also_offer{label, verb}, suggestion: true when no thread names the next step (shown as My idea),
   evidence[{id (audit only, never shown), date (YYYY-MM-DD), speaker_side: customer | us,
             speaker_name, speaker_role (the title from the stakeholder record; name alone when none; never guessed; "You" for the user), quote}]}
more[]: {n, account, account_url, trigger_class, why_now (about 45 characters), suggestion, action{kind, label (link text, "Draft intro email")}}
strips: {meetings_this_week{items[{day, time, account, card}]}, hidden_by_ledger[{account, reason}], record_check[{account, note}]}

Verbs the page sends (each works typed by hand): draft 2 | draft 2b | draft 1, 2, 4 | draft all | done 2 | snooze 2 3d (1d, 3d, 1w) | not mine 2 | why 2 | brief Account Name | more | undo 2
-->
